name: KPost UI E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Nightly full regression across all browsers.
  schedule:
    - cron: '0 2 * * *'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Required repository/organization secrets (Settings → Secrets → Actions):
#   STANDARD_USER_EMAIL     seeded standard test-user email
#   STANDARD_USER_PASSWORD  seeded standard test-user password
#   ADMIN_USER_EMAIL        seeded admin test-user email
#   ADMIN_USER_PASSWORD     seeded admin test-user password
# Never hard-code credentials in this file.
# ---------------------------------------------------------------------------
env:
  BASE_URL: https://localhost:3000

jobs:
  # -------------------------------------------------------------------------
  # Stage 1 — Static quality gate. Fast, no browsers, no app. Fails the build
  # early on type errors or lint violations before spending CI on browsers.
  # -------------------------------------------------------------------------
  static:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  # -------------------------------------------------------------------------
  # Stage 2 — Smoke. Chromium only, @smoke-tagged tests. Gives PRs a fast
  # pass/fail signal on the critical happy paths before the full matrix runs.
  # -------------------------------------------------------------------------
  smoke:
    name: Smoke (chromium)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TEST_ENV: ci
      STANDARD_USER_EMAIL: ${{ secrets.STANDARD_USER_EMAIL }}
      STANDARD_USER_PASSWORD: ${{ secrets.STANDARD_USER_PASSWORD }}
      ADMIN_USER_EMAIL: ${{ secrets.ADMIN_USER_EMAIL }}
      ADMIN_USER_PASSWORD: ${{ secrets.ADMIN_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Start KPost app
        # The exact boot command is repo-specific, so it's supplied as a
        # repository variable (Settings → Secrets and variables → Actions →
        # Variables → KPOST_START_CMD) rather than hard-coded here. Examples:
        #   docker compose up -d --wait kpost-web
        #   npm --prefix ./app ci && (npm --prefix ./app run start &)
        #   docker run -d -p 3000:3000 ghcr.io/your-org/kpost-web:latest
        env:
          KPOST_START_CMD: ${{ vars.KPOST_START_CMD }}
        run: |
          if [ -z "$KPOST_START_CMD" ]; then
            echo "::error::KPOST_START_CMD is not set. Add a repository variable" \
                 "with the command that boots KPost on ${BASE_URL}."
            exit 1
          fi
          echo "Starting KPost app: $KPOST_START_CMD"
          bash -c "$KPOST_START_CMD"

      - name: Wait for app to be ready
        run: npx wait-on --timeout 120000 --interval 2000 "${BASE_URL}"

      - name: Run smoke tests
        run: npx playwright test --project=chromium --grep @smoke

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  # -------------------------------------------------------------------------
  # Stage 3 — Full cross-browser regression. Sharded per browser so failures
  # are isolated and readable. Runs only after smoke passes.
  # -------------------------------------------------------------------------
  e2e:
    name: E2E (${{ matrix.project }})
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      CI: 'true'
      TEST_ENV: ci
      STANDARD_USER_EMAIL: ${{ secrets.STANDARD_USER_EMAIL }}
      STANDARD_USER_PASSWORD: ${{ secrets.STANDARD_USER_PASSWORD }}
      ADMIN_USER_EMAIL: ${{ secrets.ADMIN_USER_EMAIL }}
      ADMIN_USER_PASSWORD: ${{ secrets.ADMIN_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright (${{ matrix.project }})
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Start KPost app
        run: echo "TODO: provision the KPost app so it serves on ${BASE_URL}"

      - name: Wait for app to be ready
        run: npx wait-on --timeout 120000 --interval 2000 "${BASE_URL}"

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload traces & videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 14
